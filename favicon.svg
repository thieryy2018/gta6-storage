<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0d2e"/>
      <stop offset="100%" stop-color="#0a0812"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- SSD circuit board lines -->
  <rect x="4" y="4" width="24" height="24" rx="3" fill="none" stroke="#ff2d78" stroke-width="1.2" opacity="0.5"/>
  <!-- G6 text -->
  <text x="16" y="21" font-family="Arial Black, sans-serif" font-weight="900" font-size="13" fill="#ff2d78" text-anchor="middle" letter-spacing="-0.5">G6</text>
  <!-- Corner accents -->
  <rect x="4" y="4" width="4" height="1.5" rx="0.5" fill="#ff2d78" opacity="0.7"/>
  <rect x="4" y="4" width="1.5" height="4" rx="0.5" fill="#ff2d78" opacity="0.7"/>
  <rect x="24" y="4" width="4" height="1.5" rx="0.5" fill="#ff2d78" opacity="0.7"/>
  <rect x="26.5" y="4" width="1.5" height="4" rx="0.5" fill="#ff2d78" opacity="0.7"/>
  <rect x="4" y="26.5" width="4" height="1.5" rx="0.5" fill="#ff2d78" opacity="0.7"/>
  <rect x="4" y="24" width="1.5" height="4" rx="0.5" fill="#ff2d78" opacity="0.7"/>
  <rect x="24" y="26.5" width="4" height="1.5" rx="0.5" fill="#ff2d78" opacity="0.7"/>
  <rect x="26.5" y="24" width="1.5" height="4" rx="0.5" fill="#ff2d78" opacity="0.7"/>
</svg>
