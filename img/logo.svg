<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 40" height="40">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d78"/>
      <stop offset="100%" stop-color="#c060ff"/>
    </linearGradient>
  </defs>
  <!-- SSD icon -->
  <rect x="0" y="8" width="30" height="22" rx="3" fill="none" stroke="url(#lg)" stroke-width="1.8"/>
  <rect x="4" y="12" width="22" height="14" rx="2" fill="#ff2d78" opacity="0.12"/>
  <!-- chip lines -->
  <line x1="8" y1="12" x2="8" y2="26" stroke="#ff2d78" stroke-width="1" opacity="0.4"/>
  <line x1="15" y1="12" x2="15" y2="26" stroke="#ff2d78" stroke-width="1" opacity="0.4"/>
  <line x1="22" y1="12" x2="22" y2="26" stroke="#ff2d78" stroke-width="1" opacity="0.4"/>
  <!-- connector pins -->
  <rect x="5"  y="28.5" width="3" height="3" rx="0.5" fill="#ff2d78" opacity="0.7"/>
  <rect x="10" y="28.5" width="3" height="3" rx="0.5" fill="#ff2d78" opacity="0.7"/>
  <rect x="15" y="28.5" width="3" height="3" rx="0.5" fill="#ff2d78" opacity="0.7"/>
  <rect x="20" y="28.5" width="3" height="3" rx="0.5" fill="#ff2d78" opacity="0.7"/>
  <!-- G6 on chip -->
  <text x="15" y="23" font-family="Arial Black,sans-serif" font-weight="900" font-size="8" fill="url(#lg)" text-anchor="middle">G6</text>
  <!-- wordmark -->
  <text x="38" y="26" font-family="Arial Black,sans-serif" font-weight="900" font-size="18" fill="#f0e8ff" letter-spacing="-0.3">GTA6</text>
  <text x="97" y="26" font-family="Arial Black,sans-serif" font-weight="900" font-size="18" fill="#ff2d78" letter-spacing="-0.3">Storage</text>
  <text x="183" y="26" font-family="Arial,sans-serif" font-weight="400" font-size="10" fill="#a890c8">.co.uk</text>
</svg>
